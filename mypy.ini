[mypy]
# Global mypy options
strict = True

# Ignore missing imports for gi.repository (PyGObject bindings)
[mypy-gi.repository.*]
ignore_missing_imports = True

# Ignore missing imports for smbclient
[mypy-smbclient]
ignore_missing_imports = True

# Ignore missing imports for DescribeNTSecurityDescriptor
[mypy-DescribeNTSecurityDescriptor]
ignore_missing_imports = True

# Ignore missing imports for gssapi.exceptions (if no stubs available)
[mypy-gssapi.exceptions]
ignore_missing_imports = True

# Ignore missing imports for smbprotocol.exceptions (if no stubs available)
[mypy-smbprotocol.exceptions]
ignore_missing_imports = True
